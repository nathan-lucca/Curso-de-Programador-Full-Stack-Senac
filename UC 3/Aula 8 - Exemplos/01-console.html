<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 · JavaScript na página</title>
  <link rel="stylesheet" href="base.css">
  <script src="01-console.js" defer></script>
</head>
<body>
  <main class="pagina">
    <h1>JavaScript na página</h1>
    <p class="dica">Aperte <strong>F12</strong> e abra a aba <strong>Console</strong>. Tudo o que o arquivo 01-console.js mostra com console.log aparece lá.</p>
    <p>Repare na linha do head: <code>&lt;script src="01-console.js" defer&gt;</code>. O <code>defer</code> faz o JavaScript esperar o HTML carregar.</p>
  </main>
</body>
</html>
