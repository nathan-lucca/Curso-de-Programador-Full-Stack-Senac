<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 · Filtrar cartões com data-*</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filtros button[aria-pressed="true"] { background: #1f4e78; color: #fff; }
    .pratos { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card { background: #fff; padding: 16px; border-radius: 8px; }
    .escondido { display: none; }
  </style>
</head>
<body>
  <main class="pagina">
    <h1>Cardápio com filtro</h1>
    <p class="dica">Cada cartão tem <code>data-categoria</code>. O botão clicado diz qual categoria mostrar; os outros cartões ganham a classe <code>escondido</code>.</p>
    <div class="filtros">
      <button data-filtro="todos" aria-pressed="true">Todos</button>
      <button data-filtro="lanche" aria-pressed="false">Lanches</button>
      <button data-filtro="bebida" aria-pressed="false">Bebidas</button>
    </div>
    <div class="pratos">
      <div class="card" data-categoria="lanche">X-Tudo</div>
      <div class="card" data-categoria="lanche">Coxinha</div>
      <div class="card" data-categoria="bebida">Suco de caju</div>
      <div class="card" data-categoria="bebida">Refrigerante</div>
    </div>
  </main>

  <script>
    const botoes = document.querySelectorAll('[data-filtro]');
    const cards = document.querySelectorAll('.card');

    botoes.forEach((botao) => {
      botao.addEventListener('click', () => {
        const filtro = botao.dataset.filtro;                 // lê o data-filtro

        cards.forEach((card) => {
          const mostrar = filtro === 'todos' || card.dataset.categoria === filtro;
          card.classList.toggle('escondido', !mostrar);      // esconde se não for para mostrar
        });

        botoes.forEach((b) => b.setAttribute('aria-pressed', b === botao));
      });
    });
  </script>
</body>
</html>
