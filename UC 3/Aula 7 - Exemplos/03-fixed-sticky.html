<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 · fixed e sticky</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .aviso { background: #1f4e78; color: #fff; padding: 12px 16px; }

    /* STICKY: rola junto até chegar no topo, depois gruda */
    .menu {
      position: sticky;
      top: 0;               /* gruda quando chegar a 0px do topo */
      background: #f5b82e;
      padding: 12px 16px;
      font-weight: bold;
      z-index: 10;          /* fica por cima do conteúdo */
    }

    /* FIXED: fica sempre no mesmo lugar da TELA */
    .whatsapp {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #25d366;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: bold;
      text-decoration: none;
    }
    .bloco { height: 300px; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="aviso">Aviso no topo (rola normalmente)</div>
  <nav class="menu" aria-label="Menu">Menu · Início · Produtos · Contato</nav>

  <main class="pagina">
    <h1>fixed e sticky</h1>
    <p class="dica"><strong>Role a página para baixo.</strong> O menu amarelo rola junto até encostar no topo e depois gruda (sticky). O botão verde nunca sai do canto da tela (fixed).</p>
    <div class="caixa a bloco">Conteúdo 1</div>
    <div class="caixa b bloco">Conteúdo 2</div>
    <div class="caixa c bloco">Conteúdo 3</div>
    <div class="caixa d bloco">Conteúdo 4</div>
  </main>

  <a class="whatsapp" href="https://wa.me/5581999999999" aria-label="Falar pelo WhatsApp">Zap</a>
</body>
</html>
